[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["network: tests that hit the network (deselected by default)"]
addopts = "-m 'not network'"
